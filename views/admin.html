<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Your Website | Power Creations</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #1a1208; --card: #221a0e; --border: #3a2a14;
      --text: #f0e8d8; --muted: #a89070; --dim: #7a6040;
      --accent: #c8a96e; --gold: #e4c580;
      --green: #4e8f57; --red: #9e3a3a;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Georgia', 'Times New Roman', serif;
      min-height: 100dvh; padding-bottom: 40px;
      -webkit-text-size-adjust: 100%;
    }

    /* Header */
    .top {
      position: sticky; top: 0; z-index: 50;
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 16px calc(12px + env(safe-area-inset-top));
      display: flex; align-items: center; gap: 12px;
    }
    .top img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--accent); }
    .top h1 { font-size: 1.05rem; color: var(--gold); line-height: 1.2; }
    .top .who { font-size: 0.72rem; color: var(--dim); display: block; }
    .top .spacer { flex: 1; }
    .signout {
      background: none; border: 1px solid var(--border); color: var(--muted);
      border-radius: 8px; padding: 10px 14px; font-family: inherit;
      font-size: 0.85rem; cursor: pointer; min-height: 44px;
    }
    .signout:hover { border-color: var(--accent); color: var(--accent); }

    /* Section nav */
    .secnav { display: flex; gap: 8px; padding: 12px 16px 0; overflow-x: auto; }
    .secnav button {
      flex: 1 0 auto; min-height: 46px; padding: 0 18px;
      background: var(--card); border: 1.5px solid var(--border); border-radius: 9px;
      color: var(--muted); font-family: inherit; font-size: 0.95rem; cursor: pointer;
      white-space: nowrap; transition: all 0.18s;
    }
    .secnav button.on { background: var(--accent); border-color: var(--gold); color: #1a1208; font-weight: 700; }

    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
    .panel { display: none; }
    .panel.on { display: block; }

    .note { color: var(--dim); text-align: center; padding: 40px 12px; font-size: 0.95rem; line-height: 1.6; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 11px; padding: 18px; margin-bottom: 16px;
    }
    .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .who-said { color: var(--gold); font-weight: 700; }
    .when { color: var(--dim); font-size: 0.78rem; }

    label.fieldlabel { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 5px; letter-spacing: 0.03em; }
    textarea, input[type="text"] {
      width: 100%; background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 1rem; padding: 12px; outline: none; resize: vertical;
    }
    textarea:focus, input:focus { border-color: var(--accent); }
    textarea { min-height: 96px; }

    .card img.photo { margin-top: 12px; width: 100%; max-height: 260px; object-fit: cover; border-radius: 9px; border: 1px solid var(--border); }

    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .btn {
      min-height: 44px; padding: 0 18px; border-radius: 8px; border: none;
      font-family: inherit; font-size: 0.92rem; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn-save { background: var(--accent); color: #1a1208; }
    .btn-ok   { background: var(--green); color: #fff; }
    .btn-del  { background: transparent; border: 1.5px solid var(--red); color: #d98080; }
    .saved { color: var(--green); font-size: 0.85rem; align-self: center; display: none; }
  </style>
</head>
<body>

  <header class="top">
    <img src="/logo.png" alt="" />
    <div>
      <h1>Your Website</h1>
      <span class="who" id="who"></span>
    </div>
    <div class="spacer"></div>
    <button class="signout" id="signout">Sign Out</button>
  </header>

  <nav class="secnav">
    <button class="on" data-panel="reviews">Reviews</button>
    <button data-panel="soon">Photos &amp; Text</button>
  </nav>

  <div class="wrap">
    <section class="panel on" id="panel-reviews">
      <div id="reviews"><p class="note">Loading…</p></div>
    </section>

    <section class="panel" id="panel-soon">
      <p class="note">
        Adding pieces and editing your website text is coming next.<br />
        Nothing you do here will be lost.
      </p>
    </section>
  </div>

  <script>
    document.querySelectorAll('.secnav button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.secnav button').forEach(x => x.classList.remove('on'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
        b.classList.add('on');
        document.getElementById('panel-' + b.dataset.panel).classList.add('on');
      });
    });

    document.getElementById('signout').addEventListener('click', async () => {
      await fetch('/api/admin/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });

    function esc(s) {
      return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function when(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    }

    async function api(url, opts) {
      const res = await fetch(url, Object.assign({ credentials: 'same-origin' }, opts));
      if (res.status === 401) { window.location.href = '/admin/login'; throw new Error('signed out'); }
      return res;
    }

    async function loadReviews() {
      const box = document.getElementById('reviews');
      try {
        const res = await api('/api/admin/reviews');
        const list = await res.json();
        document.getElementById('who').textContent = '';

        if (!Array.isArray(list) || !list.length) {
          box.innerHTML = '<p class="note">No reviews yet.</p>';
          return;
        }
        box.innerHTML = '';
        list.forEach(r => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML =
            '<div class="card-top">' +
              '<span class="who-said">' + esc(r.name) + '</span>' +
              '<span class="when">' + when(r.submitted_at) +
                (r.status === 'approved' ? ' · Showing on site' : ' · Waiting for you') + '</span>' +
            '</div>' +
            '<label class="fieldlabel" for="t' + r.id + '">What they wrote</label>' +
            '<textarea id="t' + r.id + '">' + esc(r.text) + '</textarea>' +
            (r.image_url ? '<img class="photo" src="' + esc(r.image_url) + '" alt="" />' : '') +
            '<div class="row">' +
              '<button class="btn btn-save" data-save="' + r.id + '">Save</button>' +
              (r.status !== 'approved'
                ? '<button class="btn btn-ok" data-ok="' + r.id + '">Show on site</button>' : '') +
              '<button class="btn btn-del" data-del="' + r.id + '">Delete</button>' +
              '<span class="saved" id="s' + r.id + '">Saved</span>' +
            '</div>';
          box.appendChild(card);
        });

        box.querySelectorAll('[data-save]').forEach(b => b.addEventListener('click', async () => {
          const id = b.dataset.save;
          await api('/api/admin/reviews/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: document.getElementById('t' + id).value })
          });
          const s = document.getElementById('s' + id);
          s.style.display = 'inline'; setTimeout(() => s.style.display = 'none', 2200);
        }));

        box.querySelectorAll('[data-ok]').forEach(b => b.addEventListener('click', async () => {
          await api('/api/admin/reviews/' + b.dataset.ok + '/approve', { method: 'PATCH' });
          loadReviews();
        }));

        box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
          if (!confirm('Delete this review for good?')) return;
          await api('/api/admin/reviews/' + b.dataset.del, { method: 'DELETE' });
          loadReviews();
        }));
      } catch (err) {
        if (err.message !== 'signed out') {
          box.innerHTML = '<p class="note">Could not load reviews right now. Check back in a minute.</p>';
        }
      }
    }

    loadReviews();
  </script>
</body>
</html>
