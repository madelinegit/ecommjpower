<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Reviews | Power Creations LLC</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .page-hero {
      background: url('banner.png') center/cover no-repeat;
      background-color: #2a1a0a;
      text-align: center;
      padding: 48px 24px 40px;
      position: relative;
    }
    .page-hero::before { content:''; position:absolute; inset:0; background:rgba(20,10,2,0.62); pointer-events:none; }
    .page-hero > * { position:relative; }
    .page-hero .hero-badge { display:inline-flex; align-items:center; justify-content:center; width:64px; height:64px; border-radius:50%; background:rgba(200,169,110,0.1); border:1.5px solid #c8a96e; margin-bottom:16px; }
    .page-hero .hero-logo  { width:100%; height:100%; object-fit:cover; border-radius:50%; }
    .page-hero h1  { font-size:clamp(1.6rem,5vw,2.4rem); color:#e8d5b0; font-weight:700; margin-bottom:8px; }
    .page-hero h1 span { color:#f0c060; }
    .page-hero p   { color:#b8a090; font-size:0.95rem; }
    .back-link { display:inline-block; margin-top:14px; color:#c8a96e; font-size:0.85rem; text-decoration:none; border:1px solid rgba(200,169,110,0.4); padding:6px 14px; border-radius:20px; }
    .back-link:hover { background:rgba(200,169,110,0.1); }

    .reviews-section { max-width:860px; margin:0 auto; padding:40px 20px 20px; }
    .reviews-grid    { display:flex; flex-direction:column; gap:20px; }
    .review-card     { background:#221a0e; border:1px solid #3a2a14; border-radius:10px; padding:22px; }
    .review-card-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
    .review-name  { color:#f0c060; font-weight:700; font-size:1rem; }
    .review-date  { color:#7a6040; font-size:0.78rem; }
    .review-text  { color:#c8baa0; font-size:0.95rem; line-height:1.65; }
    .review-img   { margin-top:14px; width:100%; max-height:340px; object-fit:cover; border-radius:7px; border:1px solid #3a2a14; cursor:pointer; }
    .no-reviews   { text-align:center; color:#7a6040; padding:40px 0; font-size:0.95rem; }

    .r-lightbox { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:9999; align-items:center; justify-content:center; }
    .r-lightbox.open { display:flex; }
    .r-lightbox img  { max-width:92vw; max-height:88vh; border-radius:8px; object-fit:contain; }
    .r-lightbox-close { position:absolute; top:18px; right:22px; color:#e8d5b0; font-size:2rem; cursor:pointer; background:none; border:none; line-height:1; }

    .divider { width:60px; height:2px; background:#c8a96e; margin:10px auto 40px; opacity:0.4; }

    .submit-section { max-width:640px; margin:0 auto 60px; padding:0 20px; }
    .submit-section h2 { font-size:1.3rem; color:#e8d5b0; text-align:center; margin-bottom:24px; }
    .submit-form { background:#221a0e; border:1px solid #3a2a14; border-radius:10px; padding:28px; display:flex; flex-direction:column; gap:14px; }
    .submit-form label { color:#b8a090; font-size:0.82rem; margin-bottom:2px; display:block; }
    .submit-form input[type="text"],
    .submit-form textarea { width:100%; background:#1a1208; border:1.5px solid #3a2a14; border-radius:6px; color:#e8d5b0; font-size:0.95rem; padding:10px 14px; font-family:inherit; outline:none; transition:border-color 0.2s; }
    .submit-form input[type="text"]:focus,
    .submit-form textarea:focus { border-color:#c8a96e; }
    .submit-form textarea { min-height:120px; resize:vertical; }
    .submit-form input[type="file"] { color:#b8a090; font-size:0.85rem; }
    .submit-btn { background:#c8a96e; color:#1a1208; border:none; padding:12px; border-radius:6px; font-size:1rem; font-weight:700; cursor:pointer; transition:background 0.2s; }
    .submit-btn:hover    { background:#f0c060; }
    .submit-btn:disabled { opacity:0.5; cursor:default; }
    .success-msg { display:none; text-align:center; color:#7dbf7d; background:rgba(125,191,125,0.08); border:1px solid rgba(125,191,125,0.3); border-radius:8px; padding:16px; font-size:0.95rem; }
    .error-msg   { display:none; text-align:center; color:#e07070; font-size:0.88rem; margin-top:4px; }
  </style>
</head>
<body>

  <header class="page-hero">
    <div class="hero-badge">
      <img src="logo.png" alt="JPC" class="hero-logo" />
    </div>
    <h1>Client <span>Reviews</span></h1>
    <p>Hear from homeowners across North Lake Tahoe &amp; Truckee</p>
    <a href="/" class="back-link">← Back to Main Site</a>
  </header>

  <section class="reviews-section">
    <h2 class="section-title">What Our Clients Say</h2>
    <div id="reviews-list" class="reviews-grid">
      <p class="no-reviews">Loading reviews…</p>
    </div>
  </section>

  <div class="divider"></div>

  <section class="submit-section">
    <h2>Share Your Experience</h2>
    <form class="submit-form" id="review-form" novalidate>
      <div>
        <label for="r-name">Your Name *</label>
        <input type="text" id="r-name" placeholder="e.g. Sarah M." required />
      </div>
      <div>
        <label for="r-text">Your Review *</label>
        <textarea id="r-text" placeholder="Tell us about the work James did for you…" required></textarea>
      </div>
      <div>
        <label>Photo (optional)</label>
        <input type="file" id="r-photo" accept="image/*" />
      </div>
      <button type="submit" class="submit-btn" id="submit-btn">Submit Review</button>
      <p class="error-msg" id="form-error"></p>
    </form>
    <div class="success-msg" id="success-msg">
      Thanks for sharing! Your review has been submitted and is pending approval.
    </div>
  </section>

  <div class="r-lightbox" id="r-lightbox">
    <button class="r-lightbox-close" id="r-lb-close">&times;</button>
    <img id="r-lb-img" src="" alt="" />
  </div>

  <script>
    // ── Load reviews ───────────────────────────────────────────────
    const reviewsList = document.getElementById('reviews-list');

    async function loadReviews() {
      try {
        const res     = await fetch('/api/reviews');
        const reviews = await res.json();
        reviewsList.innerHTML = '';
        if (!reviews.length) {
          reviewsList.innerHTML = '<p class="no-reviews">No reviews yet — be the first!</p>';
          return;
        }
        reviews.forEach(r => {
          const card = document.createElement('div');
          card.className = 'review-card';
          card.innerHTML = `
            <div class="review-card-header">
              <span class="review-name">${esc(r.name)}</span>
              <span class="review-date">${fmtDate(r.approved_at)}</span>
            </div>
            <p class="review-text">${esc(r.text)}</p>
            ${r.image_url ? `<img src="${r.image_url}" class="review-img" alt="Review photo" />` : ''}
          `;
          if (r.image_url) {
            card.querySelector('.review-img').addEventListener('click', () => openLightbox(r.image_url));
          }
          reviewsList.appendChild(card);
        });
      } catch {
        reviewsList.innerHTML = '<p class="no-reviews">Could not load reviews right now.</p>';
      }
    }

    loadReviews();

    // ── Submit ─────────────────────────────────────────────────────
    document.getElementById('review-form').addEventListener('submit', async e => {
      e.preventDefault();
      const name   = document.getElementById('r-name').value.trim();
      const text   = document.getElementById('r-text').value.trim();
      const file   = document.getElementById('r-photo').files[0];
      const btn    = document.getElementById('submit-btn');
      const errEl  = document.getElementById('form-error');

      errEl.style.display = 'none';
      if (!name || !text) {
        errEl.textContent = 'Please fill in your name and review.';
        errEl.style.display = 'block';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Submitting…';

      try {
        const body = new FormData();
        body.append('name', name);
        body.append('text', text);
        if (file) body.append('photo', file);

        const res = await fetch('/api/reviews', { method: 'POST', body });
        if (!res.ok) throw new Error();

        document.getElementById('review-form').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      } catch {
        errEl.textContent = 'Something went wrong. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Submit Review';
      }
    });

    // ── Lightbox ───────────────────────────────────────────────────
    const lightbox = document.getElementById('r-lightbox');
    const lbImg    = document.getElementById('r-lb-img');
    function openLightbox(src) { lbImg.src = src; lightbox.classList.add('open'); }
    function closeLightbox()   { lightbox.classList.remove('open'); lbImg.src = ''; }
    document.getElementById('r-lb-close').addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

    // ── Helpers ────────────────────────────────────────────────────
    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }
    function fmtDate(ts) {
      if (!ts) return '';
      return new Date(ts).toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    }
  </script>
</body>
</html>
