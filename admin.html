<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Power Creations LLC</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:       #1a1208;
      --card:     #221a0e;
      --border:   #3a2a14;
      --text:     #e8d5b0;
      --muted:    #b8a090;
      --dim:      #7a6040;
      --accent:   #c8a96e;
      --gold:     #f0c060;
      --green:    #5a9e5a;
      --red:      #9e3a3a;
      --red-hover:#c44444;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height:100vh; }

    /* ── Login ── */
    #login-screen {
      display:flex; align-items:center; justify-content:center;
      min-height:100vh; padding:24px;
    }
    .login-box {
      background:var(--card); border:1px solid var(--border); border-radius:12px;
      padding:40px 36px; width:100%; max-width:380px; text-align:center;
    }
    .login-box img { width:72px; height:72px; object-fit:cover; border-radius:50%; margin-bottom:20px; border:1.5px solid var(--accent); }
    .login-box h1 { font-size:1.3rem; color:var(--text); margin-bottom:6px; }
    .login-box p  { color:var(--dim); font-size:0.85rem; margin-bottom:28px; }
    .login-box input {
      width:100%; background:var(--bg); border:1.5px solid var(--border);
      border-radius:6px; color:var(--text); font-size:0.95rem; padding:10px 14px;
      margin-bottom:12px; outline:none; transition:border-color 0.2s;
    }
    .login-box input:focus { border-color:var(--accent); }
    .login-btn {
      width:100%; background:var(--accent); color:#1a1208; border:none;
      padding:12px; border-radius:6px; font-size:1rem; font-weight:700;
      cursor:pointer; transition:background 0.2s;
    }
    .login-btn:hover { background:var(--gold); }
    .login-btn:disabled { opacity:0.5; cursor:default; }
    #login-error { color:#e07070; font-size:0.84rem; margin-top:12px; min-height:20px; }

    /* ── Dashboard ── */
    #dashboard { display:none; }
    .dash-header {
      background:var(--card); border-bottom:1px solid var(--border);
      padding:16px 24px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    }
    .dash-header-left { display:flex; align-items:center; gap:14px; }
    .dash-header-left img { width:44px; height:44px; object-fit:cover; border-radius:50%; border:1px solid var(--accent); }
    .dash-header-left h1 { font-size:1.15rem; color:var(--text); }
    .dash-header-left span { font-size:0.8rem; color:var(--dim); display:block; }
    .logout-btn {
      background:transparent; border:1px solid var(--border); color:var(--muted);
      padding:7px 16px; border-radius:6px; font-size:0.85rem; cursor:pointer;
      transition:border-color 0.2s, color 0.2s;
    }
    .logout-btn:hover { border-color:var(--accent); color:var(--accent); }

    /* ── Tabs ── */
    .dash-tabs { display:flex; gap:0; border-bottom:1px solid var(--border); background:var(--card); padding:0 24px; }
    .dash-tab-btn {
      background:none; border:none; color:var(--dim); font-size:0.95rem;
      padding:14px 20px; cursor:pointer; border-bottom:2px solid transparent;
      transition:color 0.2s, border-color 0.2s; position:relative; top:1px;
    }
    .dash-tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }
    .badge {
      display:inline-flex; align-items:center; justify-content:center;
      background:var(--red); color:#fff; font-size:0.65rem; font-weight:700;
      border-radius:10px; padding:1px 6px; margin-left:6px; min-width:18px;
    }

    /* ── Content ── */
    .dash-content { padding:24px; max-width:900px; margin:0 auto; }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    .empty-state { color:var(--dim); text-align:center; padding:48px 0; font-size:0.95rem; }

    /* ── Admin cards ── */
    .admin-card {
      background:var(--card); border:1px solid var(--border); border-radius:10px;
      padding:22px; margin-bottom:20px;
    }
    .card-meta { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
    .card-name { color:var(--gold); font-weight:700; font-size:1rem; }
    .card-date { color:var(--dim); font-size:0.78rem; }
    .card-label { color:var(--muted); font-size:0.78rem; margin-bottom:4px; display:block; }

    .edit-text {
      width:100%; background:var(--bg); border:1.5px solid var(--border);
      border-radius:6px; color:var(--text); font-size:0.9rem; padding:10px 12px;
      font-family:inherit; outline:none; resize:vertical; min-height:80px;
      transition:border-color 0.2s;
    }
    .edit-text:focus { border-color:var(--accent); }

    .admin-img-wrap { margin-top:14px; position:relative; display:inline-block; max-width:100%; }
    .admin-img { max-width:100%; max-height:260px; object-fit:cover; border-radius:7px; border:1px solid var(--border); display:block; }
    .no-img-note { color:var(--dim); font-size:0.82rem; margin-top:8px; }

    .card-actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; align-items:center; }
    .action-btn {
      padding:8px 16px; border-radius:6px; font-size:0.82rem; font-weight:600;
      border:none; cursor:pointer; transition:opacity 0.15s, background 0.15s;
    }
    .action-btn:hover { opacity:0.85; }
    .btn-save    { background:var(--accent); color:#1a1208; }
    .btn-approve { background:var(--green);  color:#fff; }
    .btn-delete  { background:var(--red);    color:#fff; }
    .btn-delete:hover { background:var(--red-hover); opacity:1; }

    .img-upload-label {
      background:var(--border); color:var(--muted); padding:8px 14px;
      border-radius:6px; font-size:0.82rem; cursor:pointer; font-weight:600;
      transition:background 0.15s;
    }
    .img-upload-label:hover { background:#4a3a24; color:var(--text); }
    .img-upload-input { display:none; }

    .btn-remove-img {
      background:none; border:1px solid var(--border); color:var(--dim);
      padding:7px 12px; border-radius:6px; font-size:0.78rem; cursor:pointer;
      transition:border-color 0.2s, color 0.2s;
    }
    .btn-remove-img:hover { border-color:var(--red); color:var(--red); }

    .save-feedback { font-size:0.8rem; color:var(--green); display:none; }
  </style>
</head>
<body>

  <!-- ── Login ── -->
  <div id="login-screen">
    <div class="login-box">
      <img src="logo.png" alt="JPC" />
      <h1>Admin Login</h1>
      <p>Power Creations LLC — Review Management</p>
      <form id="login-form" novalidate>
        <input type="email"    id="l-email"    placeholder="Email"    required autocomplete="email" />
        <input type="password" id="l-password" placeholder="Password" required autocomplete="current-password" />
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
        <p id="login-error"></p>
      </form>
    </div>
  </div>

  <!-- ── Dashboard ── -->
  <div id="dashboard">

    <div class="dash-header">
      <div class="dash-header-left">
        <img src="logo.png" alt="JPC" />
        <div>
          <h1>Review Dashboard</h1>
          <span id="admin-email"></span>
        </div>
      </div>
      <button class="logout-btn" id="logout-btn">Sign Out</button>
    </div>

    <div class="dash-tabs">
      <button class="dash-tab-btn active" data-tab="pending">
        Pending <span class="badge" id="pending-badge">0</span>
      </button>
      <button class="dash-tab-btn" data-tab="approved">Approved</button>
    </div>

    <div class="dash-content">
      <div class="tab-panel active" id="panel-pending">
        <div id="pending-list"><p class="empty-state">Loading…</p></div>
      </div>
      <div class="tab-panel" id="panel-approved">
        <div id="approved-list"><p class="empty-state">Loading…</p></div>
      </div>
    </div>

  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);
    const auth    = firebase.auth();
    const db      = firebase.firestore();
    const storage = firebase.storage();

    // ── Login ──────────────────────────────────────────────────────
    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const err = document.getElementById('login-error');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      err.textContent = '';
      try {
        await auth.signInWithEmailAndPassword(
          document.getElementById('l-email').value.trim(),
          document.getElementById('l-password').value
        );
      } catch {
        err.textContent = 'Incorrect email or password.';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => auth.signOut());

    // ── Auth state ─────────────────────────────────────────────────
    auth.onAuthStateChanged(user => {
      document.getElementById('login-screen').style.display = user ? 'none' : 'flex';
      document.getElementById('dashboard').style.display    = user ? 'block' : 'none';
      if (user) {
        document.getElementById('admin-email').textContent = user.email;
        listenPending();
        listenApproved();
      }
    });

    // ── Tabs ───────────────────────────────────────────────────────
    document.querySelectorAll('.dash-tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.dash-tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ── Realtime listeners ─────────────────────────────────────────
    function listenPending() {
      db.collection('reviews').where('status','==','pending')
        .orderBy('submittedAt','desc')
        .onSnapshot(snap => {
          document.getElementById('pending-badge').textContent = snap.size || '0';
          renderList(snap, 'pending-list', 'pending');
        });
    }

    function listenApproved() {
      db.collection('reviews').where('status','==','approved')
        .orderBy('approvedAt','desc')
        .onSnapshot(snap => {
          renderList(snap, 'approved-list', 'approved');
        });
    }

    // ── Render ─────────────────────────────────────────────────────
    function renderList(snapshot, containerId, status) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      if (snapshot.empty) {
        container.innerHTML = `<p class="empty-state">${status === 'pending' ? 'No pending reviews.' : 'No approved reviews yet.'}</p>`;
        return;
      }

      snapshot.forEach(doc => {
        const r  = doc.data();
        const id = doc.id;
        const card = document.createElement('div');
        card.className = 'admin-card';

        card.innerHTML = `
          <div class="card-meta">
            <span class="card-name">${esc(r.name)}</span>
            <span class="card-date">${fmtDate(r.submittedAt)} ${status === 'approved' ? '· <em style="color:var(--green)">Approved</em>' : '· <em style="color:var(--accent)">Pending</em>'}</span>
          </div>

          <span class="card-label">Review text</span>
          <textarea class="edit-text" data-id="${id}">${esc(r.text)}</textarea>

          <div class="admin-img-wrap" id="imgwrap-${id}">
            ${r.imageUrl
              ? `<img src="${r.imageUrl}" class="admin-img" alt="Review image" />`
              : `<p class="no-img-note">No image attached</p>`}
          </div>

          <div class="card-actions">
            <button class="action-btn btn-save"       data-id="${id}">Save Edits</button>
            <span class="save-feedback" id="saved-${id}">Saved!</span>
            <label class="img-upload-label">
              ${r.imageUrl ? 'Change Image' : 'Add Image'}
              <input type="file" accept="image/*" class="img-upload-input" data-id="${id}" />
            </label>
            ${r.imageUrl ? `<button class="btn-remove-img" data-id="${id}">Remove Image</button>` : ''}
            ${status === 'pending'
              ? `<button class="action-btn btn-approve" data-id="${id}">✓ Approve</button>`
              : ''}
            <button class="action-btn btn-delete" data-id="${id}">Delete</button>
          </div>
        `;

        container.appendChild(card);
      });

      // Save text edits
      container.querySelectorAll('.btn-save').forEach(btn => {
        btn.addEventListener('click', async () => {
          const id   = btn.dataset.id;
          const text = container.querySelector(`.edit-text[data-id="${id}"]`).value.trim();
          await db.collection('reviews').doc(id).update({ text });
          const fb = document.getElementById('saved-' + id);
          fb.style.display = 'inline';
          setTimeout(() => fb.style.display = 'none', 2500);
        });
      });

      // Approve
      container.querySelectorAll('.btn-approve').forEach(btn => {
        btn.addEventListener('click', async () => {
          await db.collection('reviews').doc(btn.dataset.id).update({
            status:     'approved',
            approvedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        });
      });

      // Delete
      container.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this review permanently?')) return;
          await db.collection('reviews').doc(btn.dataset.id).delete();
        });
      });

      // Change / Add image
      container.querySelectorAll('.img-upload-input').forEach(input => {
        input.addEventListener('change', async e => {
          const file = e.target.files[0];
          if (!file) return;
          const id  = input.dataset.id;
          const ref = storage.ref(`reviews/${Date.now()}_${file.name}`);
          input.closest('label').textContent = 'Uploading…';
          await ref.put(file);
          const url = await ref.getDownloadURL();
          await db.collection('reviews').doc(id).update({ imageUrl: url });
        });
      });

      // Remove image
      container.querySelectorAll('.btn-remove-img').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Remove the image from this review?')) return;
          await db.collection('reviews').doc(btn.dataset.id).update({ imageUrl: null });
        });
      });
    }

    // ── Helpers ────────────────────────────────────────────────────
    function esc(s) {
      return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    function fmtDate(ts) {
      if (!ts) return '';
      return ts.toDate().toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });
    }
  </script>
</body>
</html>
